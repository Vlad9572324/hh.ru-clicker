<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" role="img" aria-labelledby="t d"><title id="t">SMS OTP авторизация</title><desc id="d">Форма с замаскированным тестовым номером.</desc><style>text{font-family:ui-monospace,monospace;fill:#d9faff}.h{font-size:24px;font-weight:700}.m{font-size:15px}.s{font-size:13px;fill:#86a5af}.box{fill:#101c26;stroke:#22647a;stroke-width:2}.btn{fill:#123c35;stroke:#2ce0a5}</style><rect width="1200" height="720" fill="#071017"/><text x="45" y="60" class="h">⚙️ Настройки → Авторизация по телефону / email</text><rect x="180" y="105" width="840" height="540" rx="16" class="box"/><text x="230" y="160" class="h">📱 Mobile OTP</text><text x="230" y="205" class="s">Шаг 1 из 2 · код отправляется только по кнопке</text><text x="230" y="260" class="m">Телефон</text><rect x="230" y="280" width="740" height="55" rx="8" class="box"/><text x="255" y="314" class="m">+7*** *** 37**</text><rect x="230" y="360" width="240" height="48" rx="8" class="btn"/><text x="267" y="390" class="m">Получить SMS-код</text><text x="230" y="455" class="m">Одноразовый код</text><rect x="230" y="475" width="350" height="55" rx="8" class="box"/><text x="255" y="510" class="m">••••••</text><rect x="610" y="475" width="240" height="55" rx="8" class="btn"/><text x="660" y="510" class="m">Подтвердить</text><text x="230" y="575" class="s">После verify: OAuth tokens → резюме → autologin cookies</text><text x="230" y="605" class="s">5 неверных попыток → блокировка на 15 минут</text></svg>
