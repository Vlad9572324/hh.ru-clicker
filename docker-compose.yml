services:
  singbox:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: hhru-clicker_singbox
    restart: unless-stopped
    volumes:
      - ./data/singbox:/etc/sing-box:ro
    command: ["run", "-c", "/etc/sing-box/config.json"]

  hh-bot:
    build: .
    depends_on:
      - singbox
    ports:
      # Граница безопасности — host-side bind: published-порт доступен только
      # с loopback хоста, дашборд не торчит в LAN. Для доступа извне loopback
      # убери префикс 127.0.0.1 И задай HH_BOT_API_KEY + HH_BOT_UNSAFE_EXPOSE=1
      # (см. env ниже).
      - "127.0.0.1:8000:8000"
    environment:
      # Внутри контейнера слушаем 0.0.0.0: Docker DNAT направляет published-
      # трафик на container IP, а НЕ на container loopback — bind 127.0.0.1
      # внутри контейнера сделал бы дашборд недоступным даже с хоста.
      HH_BOT_HOST: "0.0.0.0"
      # Явный container opt-in (web_app.py::_resolve_host): разрешает bind
      # 0.0.0.0 без HH_BOT_API_KEY. Безопасность обеспечивает host-side bind
      # 127.0.0.1:8000:8000 в `ports` выше, а не bind внутри контейнера.
      # Без этого opt-in bind наружу без ключа запрещён (RuntimeError,
      # даже при HH_BOT_UNSAFE_EXPOSE=1).
      HH_BOT_ALLOW_CONTAINER_BIND: "1"
      # API-ключ обязателен для доступа к дашборду извне loopback. Для внешнего
      # доступа также нужны: ports без 127.0.0.1 префикса и HH_BOT_UNSAFE_EXPOSE=1
      # (0.0.0.0 уже задан выше; при заданном ключе opt-in не обязателен).
      # HH_BOT_API_KEY: "change-me"
      # Весь исходящий hh.ru-трафик (aiohttp-отклики и chatik-WS) уважает HH_PROXY
      # и идёт через sing-box-sidecar (VLESS+Reality → MSK IP).
      HH_PROXY: "socks5h://singbox:1080"
      # Phase 1 WS realtime (websocket.hh.ru): ходим НАПРЯМУЮ, не через singbox-цепочку.
      # "0" = direct (дефолт); "1" = WS тоже через HH_PROXY. singbox-сервис не трогаем.
      HH_WS_USE_PROXY: "0"
    volumes:
      - ./data:/app/data
      - ./web_app.py:/app/web_app.py
      - ./app:/app/app
      - ./static:/app/static
    restart: unless-stopped
