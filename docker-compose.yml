services:
  singbox:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: hhru-clicker_singbox
    restart: unless-stopped
    volumes:
      - ./data/singbox:/etc/sing-box:ro
    command: ["run", "-c", "/etc/sing-box/config.json"]

  hh-bot:
    build: .
    depends_on:
      - singbox
    ports:
      # Только loopback: дашборд не торчит в LAN. Для доступа извне loopback
      # убери префикс 127.0.0.1 И задай HH_BOT_API_KEY (+ см. env ниже).
      - "127.0.0.1:8000:8000"
    environment:
      # Дашборд слушаем только loopback: non-loopback bind без HH_BOT_API_KEY
      # запрещён (web_app.py упадёт с RuntimeError даже при HH_BOT_UNSAFE_EXPOSE=1).
      HH_BOT_HOST: "127.0.0.1"
      # API-ключ обязателен для доступа к дашборду извне loopback. Для внешнего
      # доступа также нужны: ports без 127.0.0.1, HH_BOT_HOST=0.0.0.0, HH_BOT_UNSAFE_EXPOSE=1.
      # HH_BOT_API_KEY: "change-me"
      # Весь исходящий hh.ru-трафик (aiohttp-отклики и chatik-WS) уважает HH_PROXY
      # и идёт через sing-box-sidecar (VLESS+Reality → MSK IP).
      HH_PROXY: "socks5h://singbox:1080"
    volumes:
      - ./data:/app/data
      - ./web_app.py:/app/web_app.py
      - ./app:/app/app
      - ./static:/app/static
    restart: unless-stopped
